# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "lodestone-plugin-demo"
version = "0.1.0"
description = "Example Lodestone connector loaded via lodestone.connectors entry points."
requires-python = ">=3.11"

[project.entry-points."lodestone.connectors"]
notes = "lodestone_plugin_demo:NotesConnector"

[tool.hatch.build.targets.wheel]
packages = ["."]
