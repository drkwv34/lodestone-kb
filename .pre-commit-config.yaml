# SPDX-License-Identifier: Apache-2.0
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format check
        entry: ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy strict
        entry: mypy --strict src
        language: system
        pass_filenames: false
      - id: imports
        name: import boundaries
        entry: lint-imports --config importlinter.ini
        language: system
        pass_filenames: false
      - id: module-limits
        name: module size and SPDX headers
        entry: python scripts/check_modules.py
        language: system
        pass_filenames: false
