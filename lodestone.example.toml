# SPDX-License-Identifier: Apache-2.0
schema_version = 1
[workspace]
db_path = ".lodestone/index.db"
default_project = "default"
[embed]
provider = "none"
[chunks]
target_tokens = 400
max_tokens = 800
chars_per_token = 4
[[projects]]
name = "default"
sources = ["wiki"]

[[sources]]
name = "wiki"
kind = "files"
path = "tests/fixtures/corpus"
include = ["**/*.md", "**/*.txt", "**/*.rst"]
exclude = ["drafts/**"]
max_file_bytes = 1048576
