# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "lodestone-kb"
dynamic = ["version"]
description = "Embedding-optional knowledge engine with distilled cards, hybrid search, MCP and a RAG-strategy benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Christian Agila"}]
dependencies = ["typer>=0.12", "httpx>=0.27", "pydantic>=2.7", "mcp>=2,<3", "pathspec>=0.12", "rich>=13"]

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1", "numpy>=1.26"]
dev = ["pytest>=8", "pytest-cov", "hypothesis", "mypy", "ruff", "import-linter", "pre-commit", "pip-licenses", "build"]

[project.scripts]
lodestone = "lodestone.cli:app"

[tool.hatch.version]
path = "src/lodestone/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lodestone"]
[tool.hatch.build.targets.wheel.force-include]
"src/lodestone/prompts/card.v1.md" = "lodestone/prompts/card.v1.md"
"src/lodestone/py.typed" = "lodestone/py.typed"
"schemas/evidence.v1.json" = "lodestone/schemas/evidence.v1.json"
"schemas/evalset.v1.json" = "lodestone/schemas/evalset.v1.json"
"schemas/report.v1.json" = "lodestone/schemas/report.v1.json"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
# Preserve the uploaded specifications byte for byte, including illustrative code fences.
exclude = ["docs/spec/**"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "perf: performance tests",
    "network: needs network (opt-in)",
    "slow: long-running opt-in tests",
]
addopts = "--strict-markers -m 'not perf and not network and not slow'"

[tool.coverage.run]
source = ["lodestone"]

[tool.coverage.report]
fail_under = 85
show_missing = true
